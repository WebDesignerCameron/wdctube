name: Update Closed PR Count

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Calculate Total Closed PRs (not merged)
        id: count_closed_prs
        run: |
          REPO_FULL="$GITHUB_REPOSITORY"
          OWNER="${REPO_FULL%%/*}"
          REPO="${REPO_FULL##*/}"

          # GraphQL 'CLOSED' counts pull requests with state CLOSED (this excludes MERGED if you want merged separately)
          QUERY='query { repository(owner: "'"$OWNER"'", name: "'"$REPO"'") { pullRequests(states: CLOSED) { totalCount } } }'

          COUNT=$(curl -s -H "Authorization: bearer $GITHUB_TOKEN" -X POST -d "{\"query\":\"$QUERY\"}" https://api.github.com/graphql | jq -r '.data.repository.pullRequests.totalCount')

          echo "Total closed (not merged) PRs: $COUNT"
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Update README.md
        run: |
          COUNT=${{ steps.count_closed_prs.outputs.count }}
          sed -i "s/<!-- PR_CLOSED_COUNT_START -->.*<!-- PR_CLOSED_COUNT_END -->/<!-- PR_CLOSED_COUNT_START --> Total PRs closed (not merged): $COUNT <!-- PR_CLOSED_COUNT_END -->/g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit if something actually changed to avoid loops
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update total closed PRs to ${{ steps.count_closed_prs.outputs.count }} [skip ci]" && git push)
